<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube / Orbit</title>
<style>
:root{color-scheme:light;--paper:#faf9f4;--stage:#f7f4ed;--ink:#273b32;--teal:#28766b;--line:#deddd1}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.app{max-width:1100px;margin:0 auto;padding:28px 30px 22px}.stage{background:var(--stage);border:1px solid #e3dfd5;border-radius:22px;overflow:hidden}.views{display:grid;grid-template-columns:1fr 1fr;padding:17px 12px 4px}.view{min-width:0}.view canvas{width:100%;height:400px;display:block;touch-action:none;cursor:grab}.view canvas:active{cursor:grabbing}#orbit{cursor:grab}.search-wrap{border-top:1px solid #e3dfd5;padding:8px 12px 10px;overflow:hidden}.search-wrap[hidden]{display:none}#search{display:block;width:100%;height:120px;touch-action:none;cursor:grab}.controls{display:flex;justify-content:center;align-items:center;gap:12px;padding:21px 0 0;flex-wrap:wrap}button{font:14px inherit;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:transparent;min-height:43px;padding:10px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;transition:background .15s,opacity .15s}button svg{width:17px;height:17px;flex-shrink:0}button:hover:not(:disabled){background:#eef0e7}button:focus-visible{outline:2px solid var(--teal);outline-offset:4px}button:disabled{opacity:.33;cursor:default}button.primary{background:var(--ink);border-color:var(--ink);color:#fff}button.primary:hover:not(:disabled){background:#365144}button.working{border-color:#28766b66;color:var(--teal)}button.error{border-color:#a74f38;color:#a74f38}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.app{padding:18px 15px}.views{padding:12px 0 0}.view canvas{height:310px}.controls{gap:8px;padding-top:16px}button{font-size:13px;padding:10px 13px}}@media(max-width:480px){.views{grid-template-columns:1fr}.view canvas{height:285px}.view+.view{border-top:1px solid #e7e3d944}.controls{gap:6px}button{font-size:12px;padding:10px 11px;gap:5px}button svg{width:15px;height:15px}.search-wrap{padding-left:3px;padding-right:3px}}
.strategy-row{display:flex;justify-content:center;margin-top:18px}.strategy{display:inline-flex;gap:2px;padding:3px;background:#eeeee5;border:1px solid #e1e1d5;border-radius:11px}.strategy button{border:0;min-height:30px;padding:5px 21px;font-size:12px;border-radius:7px;color:#808677}.strategy button[aria-pressed="true"]{background:var(--paper);color:var(--teal);box-shadow:0 1px 4px #283b3212}.strategy button:hover{color:var(--ink)}.controls{padding-top:12px}

</head>
<body>
<main class="app" aria-label="魔方与九圆图">
 <section class="stage">
  <div class="views">
   <div class="view"><canvas id="cube" width="500" height="400" aria-label="拖动色块拧动魔方，空白处拖动调整视角。按住 U R F D L B 锁定面，Shift 反向。" title="拖色块拧动 · 空白处拖动视角 · 按住面键锁定 · Shift 反向"></canvas></div>
   <div class="view"><canvas id="orbit" width="500" height="400" aria-label="拖动节点或圆弧，转动对应的一层。Shift 反向。" title="拖动节点或圆弧拧动 · Shift 反向"></canvas></div>
  </div>
  <div id="search-wrap" class="search-wrap" hidden><canvas id="search" width="1000" height="120" aria-label="求解器探索的魔方状态和找到的路径"></canvas></div>
 </section>
 <div class="strategy-row"><div class="strategy" role="group" aria-label="求解策略">
  <button id="strategy-optimal" type="button" aria-pressed="false" title="IDA*：证明步数最短；全局随机局面可能很慢。">最短</button>
  <button id="strategy-fast" type="button" aria-pressed="true" title="两阶段：优先尽快找到有效解，不保证步数最短。">最快</button>
 </div></div>
 <div class="controls">
  <button id="scramble" title="从全部合法局面均匀抽样；Shift+点击：10 步演示打乱。"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h3c5 0 7 12 12 12h3M18 15l3 3-3 3M3 18h3c2 0 3.5-2 5-4.5M14 8.5C15 7 16.5 6 18 6h3M18 3l3 3-3 3"/></svg><span>打乱</span></button>
  <button id="solve" title="选择最短或最快策略；不设超时，可以随时停止。"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="12" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m7 11 8.5-5M7 13l8.5 5"/></svg><span id="solve-label">开始求解</span></button>
  <button id="execute" class="primary" disabled title="依次执行求出的路径；空格暂停，右箭头单步"><svg id="execute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"/></svg><span id="execute-label">按顺序拧过去</span></button>
 </div>
 <p id="live" class="screen-reader" aria-live="polite"></p>
</main>
<script id="cube-core">
/* Geometry and facelet permutations for a 3 x 3 x 3 Rubik's cube.
 * Axes: +x right, +y up, +z front. Rows run top to bottom when
 * looking directly at a face from outside the cube.
 * The module has no dependencies and works in browsers and Node.
 */
(function (root) {
  'use strict';

  const FACES = Object.freeze(['U', 'R', 'F', 'D', 'L', 'B']);
  const COLORS = Object.freeze({
    U: '#f5f7fb', R: '#f65365', F: '#51d991',
    D: '#ffda62', L: '#ffa456', B: '#619eff'
  });
  const FACE_DATA = Object.freeze({
    U: { n: [0, 1, 0], u: [1, 0, 0], v: [0, 0, -1] },
    R: { n: [1, 0, 0], u: [0, 0, -1], v: [0, 1, 0] },
    F: { n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] },
    D: { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },
    L: { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] },
    B: { n: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0] }
  });
  Object.values(FACE_DATA).forEach(function (basis) {
    Object.freeze(basis.n); Object.freeze(basis.u); Object.freeze(basis.v);
    Object.freeze(basis);
  });

  const SLOTS = [];
  const positionIndex = new Map();
  function positionKey(p, n) { return p.join(',') + ':' + n.join(','); }
  FACES.forEach(function (face) {
    const basis = FACE_DATA[face];
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        const p = basis.n.map(function (value, axis) {
          return value + (col - 1) * basis.u[axis] + (1 - row) * basis.v[axis];
        });
        const slot = Object.freeze({
          id: SLOTS.length, face: face, row: row, col: col,
          p: Object.freeze(p), n: basis.n, u: basis.u, v: basis.v
        });
        SLOTS.push(slot);
        positionIndex.set(positionKey(slot.p, slot.n), slot.id);
      }
    }
  });
  Object.freeze(SLOTS);

  // M turns like L; E turns like D; S turns like F (standard notation).
  const MOVE_DATA = Object.freeze({
    U: { axis: 1, layer: 1, turns: -1 },
    R: { axis: 0, layer: 1, turns: -1 },
    F: { axis: 2, layer: 1, turns: -1 },
    D: { axis: 1, layer: -1, turns: 1 },
    L: { axis: 0, layer: -1, turns: 1 },
    B: { axis: 2, layer: -1, turns: 1 },
    M: { axis: 0, layer: 0, turns: 1 },
    E: { axis: 1, layer: 0, turns: 1 },
    S: { axis: 2, layer: 0, turns: -1 }
  });
  Object.values(MOVE_DATA).forEach(Object.freeze);

  function normalizeMove(move) {
    if (typeof move !== 'string') throw new TypeError('Move must be a string.');
    const normalized = move.trim().replace(/[\u2018\u2019\u2032]/g, "'").toUpperCase();
    if (!/^[URFDLBMES](?:'|2'?)?$/.test(normalized)) {
      throw new Error('Invalid cube move: ' + move);
    }
    return normalized.replace("2'", '2');
  }

  function parse(sequence) {
    if (Array.isArray(sequence)) return sequence.map(normalizeMove);
    if (typeof sequence !== 'string') throw new TypeError('Sequence must be a string or array.');
    const compact = sequence.replace(/[\s,;]+/g, '').replace(/[\u2018\u2019\u2032]/g, "'").toUpperCase();
    if (compact.length === 0) return [];
    const tokens = compact.match(/[URFDLBMES](?:2'?|')?/g) || [];
    if (tokens.join('') !== compact) throw new Error('Invalid cube sequence: ' + sequence);
    return tokens.map(normalizeMove);
  }

  function descriptor(move) {
    const canonical = normalizeMove(move);
    const base = MOVE_DATA[canonical[0]];
    const multiplier = canonical.endsWith('2') ? 2 : (canonical.endsWith("'") ? -1 : 1);
    const turns = base.turns * multiplier;
    return {
      move: canonical, face: canonical[0], axis: base.axis,
      axisName: ['x', 'y', 'z'][base.axis], layer: base.layer,
      turns: turns, angle: turns * Math.PI / 2
    };
  }

  // A right-hand-rule rotation along the POSITIVE axis. angle is in radians.
  // Fractional angles are deliberately retained for smooth rendering.
  function rotateVector(vector, axis, angle) {
    if (typeof axis === 'string') axis = ['x', 'y', 'z'].indexOf(axis.toLowerCase());
    const x = vector[0], y = vector[1], z = vector[2];
    const c = Math.cos(angle), s = Math.sin(angle);
    if (axis === 0) return [x, c * y - s * z, s * y + c * z];
    if (axis === 1) return [c * x + s * z, y, -s * x + c * z];
    if (axis === 2) return [c * x - s * y, s * x + c * y, z];
    throw new Error('Rotation axis must be 0, 1, 2, x, y, or z.');
  }

  const permutationCache = new Map();
  function cachedPermutation(move) {
    const desc = descriptor(move);
    if (permutationCache.has(desc.move)) return permutationCache.get(desc.move);
    const result = SLOTS.map(function (slot) {
      if (slot.p[desc.axis] !== desc.layer) return slot.id;
      const p = rotateVector(slot.p, desc.axis, desc.angle).map(Math.round);
      const n = rotateVector(slot.n, desc.axis, desc.angle).map(Math.round);
      const target = positionIndex.get(positionKey(p, n));
      if (target === undefined) throw new Error('Internal cube geometry mismatch.');
      return target;
    });
    Object.freeze(result);
    permutationCache.set(desc.move, result);
    return result;
  }

  // result[oldSlot] is the destination slot, never the other way around.
  function permutation(move) { return cachedPermutation(move).slice(); }

  function cycles(move) {
    const perm = cachedPermutation(move);
    const seen = new Uint8Array(54);
    const result = [];
    for (let start = 0; start < 54; start++) {
      if (seen[start]) continue;
      const cycle = [];
      let current = start;
      while (!seen[current]) {
        seen[current] = 1;
        cycle.push(current);
        current = perm[current];
      }
      if (cycle.length > 1) result.push(cycle);
    }
    return result;
  }

  function solvedState() { return SLOTS.map(function (slot) { return slot.id; }); }

  // state[position] is the original sticker id currently at that position.
  // The input state is never mutated.
  function apply(state, move) {
    if (!state || state.length !== 54) throw new Error('A cube state must contain 54 sticker ids.');
    const perm = cachedPermutation(move);
    const next = new Array(54);
    for (let oldSlot = 0; oldSlot < 54; oldSlot++) next[perm[oldSlot]] = state[oldSlot];
    return next;
  }

  function applySequence(state, sequence) {
    return parse(sequence).reduce(function (current, move) { return apply(current, move); }, Array.from(state));
  }

  function inverse(move) {
    const canonical = normalizeMove(move);
    if (canonical.endsWith('2')) return canonical;
    return canonical.endsWith("'") ? canonical.slice(0, -1) : canonical + "'";
  }

  // Returns an ARRAY of move strings, so it can be passed to applySequence
  // or displayed with .join(' '). This also accepts a string sequence.
  function inverseSequence(sequence) { return parse(sequence).reverse().map(inverse); }

  function isIdentity(state) {
    return !!state && state.length === 54 && SLOTS.every(function (slot) { return state[slot.id] === slot.id; });
  }

  // A solved cube has a uniform color on each face, including when the
  // entire cube has been reoriented through three parallel slice moves.
  function isSolved(state) {
    if (!state || state.length !== 54 || new Set(state).size !== 54) return false;
    for (let offset = 0; offset < 54; offset += 9) {
      const first = SLOTS[state[offset]];
      if (!first) return false;
      for (let j = 1; j < 9; j++) {
        const sticker = SLOTS[state[offset + j]];
        if (!sticker || sticker.face !== first.face) return false;
      }
    }
    return true;
  }

  const CubeCore = Object.freeze({
    FACES: FACES, COLORS: COLORS, FACE_DATA: FACE_DATA,
    SLOTS: SLOTS, slots: SLOTS, MOVE_DATA: MOVE_DATA,
    normalizeMove: normalizeMove, parse: parse, parseSequence: parse,
    descriptor: descriptor, rotateVector: rotateVector,
    permutation: permutation, cycles: cycles,
    solvedState: solvedState, apply: apply, applySequence: applySequence,
    inverse: inverse, inverseSequence: inverseSequence,
    isSolved: isSolved, isIdentity: isIdentity
  });
  root.CubeCore = CubeCore;
  if (typeof module !== 'undefined' && module.exports) module.exports = CubeCore;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script id="cube-gestures">
/* Pure gesture geometry; no DOM, state mutations, animation or solver.
 * Coordinate inputs and projected points use CSS pixels, with screen y down.
 * A "slot" is the CURRENT position, not the identity of its colored sticker.
 *
 * Pick once after a small drag with cubeDrag()/orbitDrag(), retain .gesture,
 * then call dragAngle(gesture, totalDrag, {project, invert, core}) each frame.
 * The returned angle is a signed right-hand rotation about the positive axis.
 * Preview |angle| / (PI/2); only commit a legal move after pointer release.
 */
(function (root) {
  'use strict';
  const HALF_PI = Math.PI / 2, TAU = 2 * Math.PI;
  function coreOf(core) {
    const c = core || root.CubeCore;
    if (!c) throw new Error('CubeGestures requires CubeCore.');
    return c;
  }
  function xy(p) { return Array.isArray(p) ? {x:p[0],y:p[1]} : p; }
  function dot(a,b) { return a.x*b.x + a.y*b.y; }
  function length(a) { return Math.hypot(a.x,a.y); }
  function crossAxis(axis,p) {
    return axis===0 ? [0,-p[2],p[1]] : axis===1 ? [p[2],0,-p[0]] : [-p[1],p[0],0];
  }
  function moveForTurn(axis,layer,sign,core) {
    const c=coreOf(core);
    const name=Object.keys(c.MOVE_DATA).find(function(m){
      const d=c.MOVE_DATA[m]; return d.axis===axis && d.layer===layer;
    });
    if (!name || !sign) return null;
    return Math.sign(c.MOVE_DATA[name].turns)===Math.sign(sign) ? name : name+"'";
  }
  function lockDescriptor(move,core) {
    return move ? coreOf(core).descriptor(String(move)[0].toUpperCase()) : null;
  }
  function projectedVelocity(point,axis,project) {
    const v=crossAxis(axis,point),eps=1e-4;
    const a=xy(project(point.map((p,i)=>p+eps*v[i])));
    const b=xy(project(point.map((p,i)=>p-eps*v[i])));
    return {x:(a.x-b.x)/(2*eps),y:(a.y-b.y)/(2*eps)};
  }
  function choose(candidates,drag,options) {
    if (length(drag)<(options.minDrag==null ? 9 : options.minDrag)) return {status:'pending',reason:'threshold'};
    const usable=candidates.filter(c=>length(c.velocity)>1e-7).map(function(c){
      const signed=dot(c.velocity,drag)/(length(c.velocity)*length(drag));
      return Object.assign({},c,{score:Math.abs(signed),sign:Math.sign(signed)});
    }).sort((a,b)=>b.score-a.score);
    if (!usable.length) return {status:'ambiguous',reason:'edge-on-or-axis-center'};
    const best=usable[0],second=usable[1];
    if (best.score<(options.minAlignment==null ? .6 : options.minAlignment)) return {status:'ambiguous',reason:'drag-not-tangential'};
    if (second && best.score-second.score<(options.minMargin==null ? .055 : options.minMargin)) {
      return {status:'ambiguous',reason:'two-directions',candidates:usable.slice(0,2)};
    }
    // Test the selected physical layer AFTER comparison. Filtering middle layers
    // first would silently redirect a middle-row swipe to an unrelated outer face.
    if (best.layer===0 && !options.allowMiddle) {
      return {status:'blocked',reason:'middle-layer-disabled',axis:best.axis,layer:0};
    }
    return {status:'ready',candidate:best};
  }
  function finish(gesture,chosen,drag,options) {
    const angle=dragAngle(gesture,drag,options);
    return {status:'ready',axis:gesture.axis,layer:gesture.layer,
      move:moveForTurn(gesture.axis,gesture.layer,angle || chosen.sign,options.core),
      angle:angle,score:chosen.score,gesture:gesture};
  }
  function cubeDrag(options) {
    const slot=options.slot,lock=lockDescriptor(options.lockedMove,options.core);
    if (!slot && !options.point) return {status:'miss',reason:'no-cube-hit'};
    if (!lock && !slot) return {status:'miss',reason:'no-position'};
    const point=options.point ? options.point.slice() : slot.p.map((v,i)=>v+.495*slot.n[i]);
    const axes=lock ? [lock.axis] : [0,1,2].filter(a=>Math.abs(slot.n[a])<.5);
    const candidates=axes.map(function(axis){return {
      axis:axis,layer:lock ? lock.layer : slot.p[axis],
      velocity:projectedVelocity(point,axis,options.project)
    };});
    const result=choose(candidates,options.drag,options);
    if (result.status!=='ready') return result;
    const best=result.candidate;
    return finish({type:'cube',axis:best.axis,layer:best.layer,point:point},best,options.drag,options);
  }
  function orbitRings(centers,options) {
    options=options || {};
    const scale=options.scale==null ? 1 : options.scale;
    const origin=xy(options.origin || {x:0,y:0});
    const base=options.base==null ? 95 : options.base;
    const step=options.step==null ? -20 : options.step;
    return centers.flatMap(function(value,axis){
      const c=xy(value);
      return [-1,0,1].map(layer=>({axis:axis,layer:layer,
        center:{x:origin.x+scale*c.x,y:origin.y+scale*c.y},radius:scale*(base+step*layer)}));
    });
  }
  function quarterArc(slot,ring,points,sign,core) {
    const c=coreOf(core),move=moveForTurn(ring.axis,ring.layer,sign,c);
    const target=c.permutation(move)[slot.id];
    const a=xy(points[slot.id]),b=xy(points[target]),center=ring.center;
    let delta=Math.atan2(b.y-center.y,b.x-center.x)-Math.atan2(a.y-center.y,a.x-center.x);
    const direction=-sign; // Increasing screen angle is a NEGATIVE spatial turn.
    while (delta*direction<0) delta+=direction*TAU;
    return Math.abs(delta);
  }
  function orbitDrag(options) {
    const point=xy(options.point),slot=options.slot,lock=lockDescriptor(options.lockedMove,options.core);
    const tolerance=options.hitTolerance==null ? 8 : options.hitTolerance;
    let rings=options.rings.filter(function(r){
      if (lock) return r.axis===lock.axis && r.layer===lock.layer;
      if (slot) return Math.abs(slot.n[r.axis])<.5 && slot.p[r.axis]===r.layer;
      return Math.abs(Math.hypot(point.x-r.center.x,point.y-r.center.y)-r.radius)<=tolerance;
    });
    if (!rings.length) return {status:'miss',reason:'no-circle-hit'};
    if (!slot && !lock) {
      const distance=r=>Math.abs(Math.hypot(point.x-r.center.x,point.y-r.center.y)-r.radius);
      const nearest=Math.min(...rings.map(distance));
      rings=rings.filter(r=>distance(r)<=nearest+(options.distanceTie==null ? 3 : options.distanceTie));
    }
    const source=(slot && options.points) ? xy(options.points[slot.id]) : point;
    const candidates=rings.map(function(r){
      const radial={x:source.x-r.center.x,y:source.y-r.center.y};
      return {axis:r.axis,layer:r.layer,ring:r,velocity:{x:radial.y,y:-radial.x}};
    });
    const result=choose(candidates,options.drag,options);
    if (result.status!=='ready') return result;
    const best=result.candidate,ring=best.ring;
    const onRing=slot && Math.abs(slot.n[ring.axis])<.5 && slot.p[ring.axis]===ring.layer && options.points;
    const gesture={type:'orbit',axis:best.axis,layer:best.layer,point:source,
      center:{x:ring.center.x,y:ring.center.y},
      positiveArc:onRing ? quarterArc(slot,ring,options.points,1,options.core) : HALF_PI,
      negativeArc:onRing ? quarterArc(slot,ring,options.points,-1,options.core) : HALF_PI};
    return finish(gesture,best,options.drag,options);
  }
  function cubeAngle(gesture,drag,options) {
    const c=coreOf(options.core),project=options.project,point=gesture.point;
    const start=xy(project(point)),target={x:start.x+drag.x,y:start.y+drag.y};
    const limit=options.limit==null ? HALF_PI : options.limit;
    function loss(angle) {
      const p=xy(project(c.rotateVector(point,gesture.axis,angle)));
      return (p.x-target.x)**2+(p.y-target.y)**2;
    }
    // The grip traces a projected circular arc (an ellipse for this camera).
    // A coarse bracket plus a bounded scalar minimization also works with a
    // perspective project() callback and avoids inverse-view sign assumptions.
    const count=24,step=2*limit/count;
    let best=0,bestLoss=Infinity;
    for(let i=0;i<=count;i++) {
      const angle=-limit+i*step,value=loss(angle);
      if(value<bestLoss){bestLoss=value;best=angle;}
    }
    let low=Math.max(-limit,best-step),high=Math.min(limit,best+step);
    for(let i=0;i<24;i++) {
      const a=low+(high-low)/3,b=high-(high-low)/3;
      if(loss(a)<=loss(b)) high=b;else low=a;
    }
    const angle=(low+high)/2;
    // Include endpoints so a drag past the quarter turn returns precisely 90°.
    return [-limit,angle,limit].reduce((a,b)=>loss(a)<loss(b) ? a : b);
  }
  function dragAngle(gesture,drag,options) {
    options=options || {};
    let angle;
    if (length(drag)<1e-8) return 0;
    if (gesture.type==='cube') angle=cubeAngle(gesture,drag,options);
